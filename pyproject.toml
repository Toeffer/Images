[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bildwerk"
version = "0.1.0"
description = "Kleines, erweiterbares Bildbearbeitungsprogramm im Browser – mit Auswahlwerkzeugen, Schärfen und KI-Bildgenerierung."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
    "pillow>=10.1",
    "numpy>=1.24",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Lokale KI direkt in Bildwerk (KI-Schärfen mit Real-ESRGAN), unter Windows über DirectML auf der Grafikkarte
local = [
    "onnx>=1.16",
    "onnxruntime-directml>=1.18; sys_platform == 'win32'",
    "onnxruntime>=1.18; sys_platform != 'win32'",
]
# iPhone-Fotos (HEIC/HEIF) öffnen
heic = ["pillow-heif>=0.16"]
dev = ["pytest>=8", "playwright>=1.40"]

[project.scripts]
bildwerk = "bildwerk.__main__:main"

[tool.setuptools.packages.find]
include = ["bildwerk*"]

[tool.setuptools.package-data]
bildwerk = ["static/*.html", "static/css/*.css", "static/js/*.js", "static/js/*/*.js", "static/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: Browser-Tests mit Playwright (langsamer)"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
